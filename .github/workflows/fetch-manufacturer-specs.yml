# Source-precedence tier 1: manufacturer specifications.
#
# WHY THIS RUNS HERE AND NOT IN A SESSION
# Every manufacturer host answers 403 on CONNECT from the agent session's egress
# proxy — an organisation policy denial, not a dead host. Tier 1 was therefore
# empty for the whole of Round 1, and heater kW sat at 31.7% of matched active
# SKUs. Actions is not blocked, so the fetcher lives here. The session writes
# the code; the runner does the fetching.
#
# DISPATCH ONLY, NO SCHEDULE — deliberately, for now.
# This reaches out to other companies' servers. Before it runs on a cadence a
# human should read one run's output and confirm we are being a good citizen.
# Add `schedule:` only after that.
#
# RUN `mode: discover` FIRST.
# Every product_url_template in data/manufacturer-registry.json is null, because
# they were written from a session that could not test a single one. A URL
# template that has never been fetched is a guess, and a guessed template does
# not fail safely: inh-seo/CLAUDE.md records a followed redirect answering from
# a category page while the requested URL was a product page, which put a
# category FAQ into a report as a product specification. The fetch succeeded and
# the content was real; the attribution was wrong.
# `discover` probes robots.txt and the homepage per vendor and commits the
# evidence. Fill the templates from that, then run `mode: fetch`.
#
# ── STEP ORDER: EVERY GATE THAT CAN RUN BEFORE THE CRAWL, DOES ─────────────
# fetch-external-data.yml lost three runs to gates placed after the network
# work; the reasoning is written out in full at the top of that file. It matters
# more here than there. This job requests pages from eleven other companies'
# servers at 2s intervals, and a crawl discarded because pytest was not
# installed is bandwidth we asked for and then wasted. Tests, lint and preflight
# now all run before the first outbound request.
#
# Nothing was loosened to achieve it: the suite is unchanged, and the
# stdlib-only proof below is now stronger than it was.

name: fetch manufacturer specs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover = probe robots.txt + homepage only. fetch = read product pages."
        type: choice
        options: [discover, fetch]
        default: discover
      delay:
        description: "Seconds between requests to the same host (politeness)"
        default: "2"
      limit:
        description: "Stop after N SKUs (0 = all). Use a small number for the first fetch run."
        default: "0"

concurrency:
  group: fetch-manufacturer-specs    # never two crawls at once
  cancel-in-progress: false

permissions:
  contents: write                    # commits the cached dataset back

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode }}
      DELAY: ${{ inputs.delay }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── PRE-CRAWL GATES ────────────────────────────────────────────────────

      # This step runs BEFORE the install, on a genuinely bare interpreter, so
      # the environmental proof is intact: the fetcher and the shared parsers
      # start on a runner with nothing pip-installed.
      #
      # But that proof only ever held while the job happened to install nothing,
      # and this job now installs pytest. So `preflight --static` backs it with
      # an ASSERTION: it walks the AST of scripts/fetch_manufacturer_specs.py,
      # src/power_parse.py and scripts/verify_theme_asset_path.py and fails on
      # any import that is neither stdlib nor local. That invariant no longer
      # depends on what the runner happens to have. The same step also checks
      # that every third-party import in the tree is declared in
      # requirements.txt, and that every .py any workflow names exists in this
      # checkout — the two other shapes the recent failures took.
      - name: Guards self-test on a bare interpreter, and the dependency proof
        run: |
          python src/power_parse.py
          python scripts/preflight.py --self-test
          python scripts/preflight.py --static

      # One source of truth. No second hand-written pip line: that is how pytest
      # came to be in requirements.txt and absent from the runner.
      - name: Install
        run: python -m pip install -q -r requirements.txt

      - name: Preflight — prove the install delivered
        run: python scripts/preflight.py --imports

      # Before the crawl, not after it. A red suite must never cost a vendor a
      # single request.
      - name: Sweep — tests and the missing-value lint
        run: |
          python -m pytest tests/ -q
          python scripts/lint_missing_values.py

      # ── THE CRAWL ──────────────────────────────────────────────────────────
      # Inputs travel through env, never interpolated into the shell command:
      # `${{ }}` inside a run block is textual substitution, so a dispatch input
      # containing shell metacharacters would execute. --delay and --limit are
      # typed by argparse, which rejects a non-numeric value outright.
      - name: Discover — robots.txt and homepage per vendor
        if: inputs.mode == 'discover'
        run: python scripts/fetch_manufacturer_specs.py --discover --delay "$DELAY"

      - name: Fetch — product pages
        if: inputs.mode == 'fetch'
        run: |
          python scripts/fetch_manufacturer_specs.py \
            --delay "$DELAY" --limit "$LIMIT"

      # Rebuilding here means the coverage number in the log is measured on this
      # run's data rather than asserted from the previous one.
      - name: Rebuild cost tables with tier 1 merged
        if: inputs.mode == 'fetch'
        run: |
          if compgen -G "data/admin-pull-*.json" > /dev/null; then
            python scripts/build_cost_tables.py data/admin-pull-*.json
          else
            echo "NOTE: no committed Admin API pull found, so cost-tables.json is"
            echo "not rebuilt here. The manufacturer cache IS committed; rebuild"
            echo "from a session that can read the Admin API."
          fi

      # Runs even on a halt, so a crawl is never repeated just to see what it
      # found. Asking eleven vendors for the same pages twice is the cost of
      # throwing this away.
      - name: Keep the crawl output whatever the outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manufacturer-specs-run-${{ github.run_number }}
          path: |
            data/facts/manufacturer_specs.json
            data/facts/manufacturer-discovery.json
            data/cost-tables.json
          if-no-files-found: warn
          retention-days: 14

      # `git add` of an absent path fails, and the previous version silenced
      # that with `2>/dev/null || true` — which also silenced a real failure.
      # Each path is added only if it exists, so absence is expected and an
      # error is still an error.
      - name: Commit the cache
        run: |
          git config user.name  "inh-fetcher[bot]"
          git config user.email "inh-fetcher@users.noreply.github.com"
          for f in data/facts/manufacturer_specs.json \
                   data/facts/manufacturer-discovery.json \
                   data/cost-tables.json; do
            if [ -f "$f" ]; then git add -f "$f"; else echo "  absent, skipping: $f"; fi
          done
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "manufacturer specs: $MODE run ${{ github.run_number }}"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
