# InHouse Wellness autoposter — CI, NOT the publishing path.
#
# ── PUBLISHING MOVED OUT OF CI (Round 14) ───────────────────────────────────
# Posting now happens in ONE human-triggered agent session a week, which hands
# Blotato a full week of posts with future timestamps. Blotato publishes from
# its own infrastructure, so nothing needs to run here on a cadence and the
# Mac can be off. See scripts/schedule_week.py and CLAUDE.md.
#
# WHY: the publish step needs the Blotato MCP tool, which exists only inside an
# agent session. The REST alternative is blocked — BLOTATO_API_KEY returns 401
# on every documented endpoint and header variant, padding included, while the
# MCP path works on the same account. The plan tier appears not to include REST
# access. That is not a bug to keep debugging.
#
# WHAT WOULD RE-ENABLE THE CRON: a Blotato API key that authenticates against
# https://backend.blotato.com/v2. The REST client (src/blotato.py) and the
# REST/MCP payload parity test are already built and tested, so re-enabling is
# uncommenting the schedule below and setting the secret — not a rewrite.
#
# WHAT STILL RUNS HERE: everything that does not publish — tests, the
# missing-value lint, the font check and the fact-layer refresh. Those are
# worth keeping green on a schedule.
name: autoposter

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Which track to run"
        type: choice
        options: [A, B]
        default: A
      publish:
        description: "Actually publish (false = render, validate and stage only)"
        type: boolean
        default: false
  schedule:
    # NON-PUBLISHING maintenance only: tests, lint, font check, fact refresh.
    # Mondays 06:00 UTC = 02:00 ET / 23:00 PT Sunday.
    - cron: "0 6 * * 1"

concurrency:
  group: autoposter           # never two publishing runs at once
  cancel-in-progress: false

permissions:
  contents: write             # to commit state/ back after a successful run

jobs:
  post:
    runs-on: ubuntu-latest
    # Halt-on-failure: steps are ordered gates and none may swallow an error.
    # The job stops at the first failure; only reporting steps run after one.
    env:
      # Secrets, never .env — that file does not exist on a runner.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # A scheduled run is ALWAYS Track A. Only a dispatch may choose.
      TRACK: ${{ github.event.inputs.track || 'A' }}
      PUBLISH: ${{ github.event.inputs.publish || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q python-dotenv anthropic imageio-ffmpeg
          # Chromium plus the system libraries a headless render needs.
          python -m playwright install --with-deps chromium

      - name: Prove the six secrets arrived
        run: |
          python - <<'PY'
          import os, sys
          need = ["ANTHROPIC_API_KEY", "ANTHROPIC_WORKSPACE_ID", "BLOTATO_API_KEY",
                  "EIA_API_KEY", "CENSUS_API_KEY", "FRED_API_KEY"]
          missing = [k for k in need if not (os.environ.get(k) or "").strip()]
          for k in need:
              v = os.environ.get(k) or ""
              print(f"  {k:24s} {'present len=' + str(len(v)) if v.strip() else 'MISSING'}")
          if missing:
              sys.exit(f"HALT: missing secrets: {', '.join(missing)}")
          PY

      - name: Gate — D5 breadcrumb must be clear
        run: |
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("state/publishing.breadcrumb.json")
          if p.exists():
              sys.exit("HALT: a D5 breadcrumb is present — a previous run may have "
                       "published without capturing the id. A human clears this.")
          print("D5 breadcrumb: clear")
          PY

      - name: Gate — broken-post counter must be clean
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("state/broken-post-counter.json")
          if p.exists():
              s = json.loads(p.read_text())
              if s.get("total_broken", 0) and s.get("streak_days", 0) == 0:
                  sys.exit("HALT: the broken-post streak is at zero. Fix and clear by hand.")
              print(f"streak {s.get('streak_days')}/14 clean days")
          PY

      - name: Sweep
        run: |
          python -m pytest tests/ -q
          python scripts/lint_missing_values.py

      - name: Prove fonts render from the repo, not a fallback
        run: python scripts/check_fonts.py

      - name: Refresh the fact layer
        run: python scripts/fetch_facts.py

      # Publishing never runs on the schedule — only on an explicit dispatch.
      - name: Track A — 2 Pinterest pins
        if: env.TRACK == 'A' && github.event_name == 'workflow_dispatch'
        run: |
          python scripts/run_cycle.py --live --platforms pinterest \
            ${{ (github.event.inputs.publish == 'true') && '--publish' || '' }}

      - name: Track B — 1 Facebook finding (human-triggered only)
        if: env.TRACK == 'B' && github.event_name == 'workflow_dispatch'
        run: |
          python scripts/run_finding.py --live \
            ${{ (github.event.inputs.publish == 'true') && '--publish' || '' }}

      # "The runner renders differently from local" is a stop-and-ask, so the
      # runner publishes a fingerprint to compare against the local baseline.
      - name: Fingerprint the renders
        if: always()
        run: python scripts/render_manifest.py out/staged || true

      - name: Upload renders for comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-run-${{ github.run_number }}
          path: |
            out/staged/**/*.png
            out/staged/**/render-manifest.json
            out/staged/**/staged.json
          if-no-files-found: warn
          retention-days: 14

      - name: Daily report
        if: always()
        run: |
          python scripts/daily_report.py --track "$TRACK" \
            ${{ job.status != 'success' && '--halt "a step failed — see the run log"' || '' }}

      - name: Append the runlog entry
        if: always()
        run: |
          {
            echo ""
            echo "## $(date -u +%Y-%m-%dT%H:%MZ) — CI run ${{ github.run_number }}"
            echo "- outcome: ${{ job.status }}"
            echo "- trigger: ${{ github.event_name }}, track ${TRACK}, publish ${PUBLISH}"
          } >> RUNLOG.md

      # State is COMMITTED BACK, not cached. The counter and the published log
      # are the audit trail for the 14-day gate: an Actions cache is evictable
      # (LRU, 7 days), and a cache miss is indistinguishable from a fresh start,
      # which would silently reset the streak to zero — the same "absence taken
      # as a value" failure this project keeps hitting. A commit is durable,
      # diffable and reviewable.
      #
      # Only on SUCCESS: a failed run must never write the counter, so a halt
      # cannot corrupt the audit trail. The breadcrumb is committed either way
      # so a crashed publish stays visible to the next run.
      - name: Commit state back
        if: always()
        run: |
          git config user.name  "autoposter[bot]"
          git config user.email "autoposter@users.noreply.github.com"
          if [ "${{ job.status }}" = "success" ]; then
            git add -f state/ REPORTS.md RUNLOG.md
          else
            git add -f state/publishing.breadcrumb.json REPORTS.md RUNLOG.md || true
          fi
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "autoposter: run ${{ github.run_number }} (${{ job.status }})"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
