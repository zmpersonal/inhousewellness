# Refresh every external dataset the agent session cannot reach.
#
# WHY THIS RUNS HERE
# api.eia.gov, outdoorsteamsauna.com, infinitesauna.com and
# besthomeinfraredsauna.com all answer 403 on CONNECT from the agent session's
# egress proxy. So the caches went stale and stayed stale. Round 1 recorded that
# staleness per field rather than pretending to a refresh. This is the refresh.
#
# IT REUSES scripts/fetch_facts.py RATHER THAN ADDING A SECOND FETCHER.
# That script already parses all 13 datasets directly from their CSV/JSON
# endpoints, and it is what produced the caches already in the repo. A parallel
# fetcher would be a second definition of "what the data is" and the two would
# drift. Never route a number through a summarizer: these are endpoint parses.
#
# ── STEP ORDER: GATES BEFORE THE NETWORK, NOT AFTER IT ──────────────────────
# Run 3 refreshed all 13 datasets in 17s, cleared the row floors, passed the
# missing-value lint — and then failed on `No module named pytest` and threw the
# whole refresh away. Three runs, no data persisted.
#
# The instinct is to move the commit ahead of the test gate. That is the wrong
# fix. It would land data produced by a tree that, as far as the run knows, is
# broken — and this project's standing rule is that the validator has no "clean
# it up and post anyway" path. The gate was not in the wrong place relative to
# the commit. It was in the wrong place relative to the FETCH.
#
# So the gates are partitioned by what they actually depend on:
#
#   BEFORE the fetch — everything that reads only the repo as committed.
#     lint_missing_values.py scans *.py sources and cannot see data at all. The
#     suite's one reader of data/facts is test_facts_cache_gate.py, and what it
#     asserts — that the CURRENTLY COMMITTED caches are intact — is a statement
#     about the tree, answered before the refresh overwrites them. Neither had
#     any reason to run after the fetch, and when they did, a missing pytest
#     threw away 13 clean datasets. Moving them first also means a broken suite
#     costs no bandwidth on other people's servers, and preflight names a
#     missing dependency in ~2s instead of ~25.
#
#   AFTER the fetch — scripts/check_facts_cache.py alone, because it is the only
#     check that needs the new bytes in hand. It shares its code with that test,
#     so the committed caches and the refreshed ones are held to one standard
#     that cannot drift into two.
#
# The consequence is the property that was missing: a failure after the fetch is
# now attributable to the fetch, so discarding the refresh is the correct
# response rather than an accident. Nothing was loosened to get there — the
# post-fetch gate got STRICTER (it now also asserts each file parses, is dated,
# and that row_count agrees with len(rows)), and the refreshed caches upload as
# an artifact even on failure, so a halt preserves the evidence instead of
# destroying it.
#
# If a test is ever added that reads data/facts, it belongs in the post-fetch
# gate, not in the pre-fetch sweep. That is the line: does it need the refresh?
#
# DISPATCH ONLY for now. Once one run has been read by a human, a monthly
# schedule is the obvious next step — EIA publishes monthly.

name: fetch external data

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated dataset names, or blank for all 13"
        default: ""

concurrency:
  group: fetch-external-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      # Keys, never values. EIA/Census/FRED each need one; the satellite CSVs
      # and the outdoorsteamsauna feeds are public and need none.
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── PRE-FETCH GATES ────────────────────────────────────────────────────
      # Cheapest first, and all of them before a single byte is fetched.

      # Bare interpreter, nothing installed yet, ~2 seconds. Asserts that every
      # third-party import in the tree is declared in requirements.txt, that
      # every .py any workflow names exists in THIS checkout, and that the
      # outward-reaching scripts are still stdlib-only. Those are the three
      # shapes the last three failures took.
      - name: Preflight — static checks on a bare interpreter
        run: |
          python scripts/preflight.py --self-test
          python scripts/preflight.py --static

      # Presence by LENGTH only — never the value. A missing key is named here
      # rather than surfacing later as an empty dataset, because "the key was
      # absent" and "the source returned nothing" are different facts and this
      # project has confused them before.
      - name: Prove the keys arrived, without printing them
        run: |
          python - <<'PY'
          import os, sys
          missing = []
          for k in ("EIA_API_KEY", "CENSUS_API_KEY", "FRED_API_KEY"):
              v = os.environ.get(k) or ""
              if not v.strip():
                  missing.append(k)
              print(f"  {k:16s} {'present len=' + str(len(v)) if v.strip() else 'MISSING'}")
          if missing:
              sys.exit("HALT: missing secrets: " + ", ".join(missing))
          PY

      # ONE source of truth for what this repo needs. There is deliberately no
      # second, hand-written pip line here: that is exactly how pytest came to
      # be in requirements.txt and absent from the runner. preflight --deps
      # above guarantees this file covers every import in the tree.
      - name: Install
        run: python -m pip install -q -r requirements.txt

      - name: Preflight — prove the install delivered
        run: python scripts/preflight.py --imports

      # Static checks on the tree as committed. Neither reads data/facts, which
      # is precisely why they run here and not after the refresh.
      - name: Sweep — tests and the missing-value lint
        run: |
          python -m pytest tests/ -q
          python scripts/lint_missing_values.py

      - name: Record cache ages BEFORE the refresh
        run: python scripts/check_facts_cache.py --report

      # ── THE NETWORK WORK ───────────────────────────────────────────────────
      # The dispatch input goes through env, never interpolated into the shell
      # command: `${{ }}` in a run block is textual substitution, so an input
      # containing shell metacharacters would execute.
      - name: Refresh
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python scripts/fetch_facts.py --only "$ONLY"
          else
            python scripts/fetch_facts.py
          fi

      - name: Refresh the ZIP -> state table
        run: python scripts/fetch_zip_state.py

      # ── POST-FETCH GATE ────────────────────────────────────────────────────
      # The only check that needs the new bytes. Halts on a file that will not
      # parse, a missing fetched_at, a row_count that disagrees with its rows,
      # or a dataset that shrank below its floor — a truncated response is not
      # a finding about the world.
      - name: Gate the refreshed cache
        run: python scripts/check_facts_cache.py

      # CONTENT drift is a FINDING, not a failure — and it is written to the run
      # summary, because a finding nobody reads is not a finding.
      #
      # tests/test_validator.py used to assert that "90", "71", "46" and "34"
      # appear in the EMF grounding text. On 2026-09-15 the publisher retired two
      # Dynamic models and resolved a duplicate record, so 90 became 87 and 71
      # became 68 — and that test failed inside `fetch manufacturer specs`,
      # blocking a crawl with no connection to EMF labels. Any test pinning a
      # literal from refreshed third-party data will fail on some future refresh.
      #
      # So this step reports every moved metric and exits 0. It halts only on
      # something no publisher edit can produce: a filtered count larger than the
      # set it was filtered from, an unordered median, a negative count, two
      # clusters disagreeing on one file's row count, EMF labels covering under
      # half the index, a metric collapsing to zero or vanishing from the schema,
      # or a move beyond tolerance in both relative AND absolute terms.
      - name: Report fact-layer drift
        run: |
          {
            echo '## Fact-layer drift'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # `|| status=$?` is load-bearing: the default shell is `bash -e`, so a
          # bare failing pipeline would abort the step before the footer is
          # written. pipefail makes the python exit code survive the tee.
          set -o pipefail
          status=0
          python scripts/check_facts_drift.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" \
            || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "Drift check HALTED — see above. This is not a publisher edit." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Drift is a finding, not a failure. Acknowledge real publisher" \
                 "edits with \`scripts/check_facts_drift.py --accept\`._" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # Runs even on a halt, so a rejected refresh is still inspectable. The
      # gate above still blocks the commit; this only stops the bytes from
      # being destroyed along with the runner.
      - name: Keep the refreshed data whatever the outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facts-run-${{ github.run_number }}
          path: |
            data/facts/*.json
            data/zip-to-state.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit the caches
        run: |
          git config user.name  "inh-fetcher[bot]"
          git config user.email "inh-fetcher@users.noreply.github.com"
          git add -f data/facts/ data/zip-to-state.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "external data refresh: run ${{ github.run_number }}"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
