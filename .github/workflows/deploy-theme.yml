# Upsert the True Total Cost files into an UNPUBLISHED theme, then verify the
# result by driving the real preview URL.
#
# WHY A WORKFLOW AND NOT A SESSION
# An agent session cannot reach Shopify: `inhousewellness.myshopify.com` answers
# 403 on CONNECT from the egress proxy, and the MCP connector that CAN reach it
# travels a different transport -- which is not the transport a scheduled job
# will use. It also cannot carry the two JSON assets: 214 KB + 269 KB base64 is
# past the point where relaying a file through an agent's own output is either
# affordable or verifiable. Actions has open egress and carries files as files.
#
# THE LIVE THEME IS REFUSED IN CODE, not by convention, whatever id is passed.
# `scripts/deploy_theme_files.py` imports `refusal_for` from
# verify_theme_asset_path, whose --self-test fires the guard against a MAIN theme
# offline, because it has never been able to fire against Shopify from a
# developer machine.
#
# TWO JOBS, AND THE SPLIT IS THE POINT
#   deploy -- STDLIB ONLY. Nothing is pip-installed, because nothing the deploy
#             path imports is third-party (asserted by preflight --stdlib-only).
#             A deploy that cannot be broken by a dependency resolving
#             differently is worth more than one that also runs pytest.
#   verify -- installs Playwright and drives the DEPLOYED preview URL through every
#             state group. It runs after, it cannot affect the write, and its
#             screenshots are of the real page rather than a local harness.
#
# THE FULL SUITE RUNS BEFORE THE COMMIT, NOT HERE. 513 tests, the missing-value
# lint across both scopes, and preflight are a local gate on the change; the
# gates below are the ones that bear on THIS WRITE, and every one of them runs
# before a byte is sent.

name: deploy theme files

on:
  workflow_dispatch:
    inputs:
      theme_id:
        description: "Numeric id of the target theme. MAIN is refused unless allow_live_theme_id names this exact id."
        required: true
        default: "146278776899"
      allow_live_theme_id:
        description: "DELIBERATE live-theme override. Leave EMPTY for any normal deploy. To write to MAIN, type MAIN's numeric id here AND in theme_id — the two must match, and the use is logged."
        required: false
        default: ""
      live:
        description: "write = actually upsert. dry = print the manifest and stop."
        type: choice
        options: [dry, write]
        default: dry
      require_unchanged_vs:
        description: "Numeric id of a frozen SNAPSHOT of the target theme. If given, the write is refused unless the target is still identical to it in every file. Use the backup theme id when deploying to MAIN."
        required: false
        default: ""
      verify_url:
        description: "The exact URL the verify job drives. Empty = the preview URL for theme_id. For a live check pass https://inhousewellness.com/pages/sauna-cost with NO preview parameter."
        required: false
        default: ""
      pages:
        description: "publish = the four pages go live on the store NOW (needed for the preview URLs to resolve). draft = created but invisible, URLs 404. skip = leave pages alone."
        type: choice
        options: [publish, draft, skip]
        default: publish

concurrency:
  group: deploy-theme
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The store domain and the API version are LITERALS, not secrets. A shop
  # domain is public -- it is in every storefront URL -- and holding it in a
  # secret only means a deploy fails with "no credential" when the truth is
  # "nobody set the non-secret". Only the token is a secret.
  SHOPIFY_SHOP: inhousewellness.myshopify.com
  SHOPIFY_API_VERSION: "2026-07"

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      shop: ${{ env.SHOPIFY_SHOP }}
    env:
      THEME_ID: ${{ inputs.theme_id }}
      MODE: ${{ inputs.live }}
      ALLOW_LIVE: ${{ inputs.allow_live_theme_id }}
      SNAPSHOT: ${{ inputs.require_unchanged_vs }}
      PAGES: ${{ inputs.pages }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── PRE-WRITE GATES. None needs Shopify, and none needs an install. ───
      - name: Preflight — static checks on a bare interpreter
        run: |
          python scripts/preflight.py --self-test
          python scripts/preflight.py --static

      - name: Prove the guards fire
        run: |
          python scripts/verify_theme_asset_path.py --self-test
          python scripts/deploy_theme_files.py --self-test
          python scripts/deploy_pages.py --self-test
          python scripts/deploy_redirects.py --self-test
          python scripts/build_storefront_assets.py --self-test
          python scripts/preview_true_total_cost.py --self-test

      - name: The missing-value lint, across both scopes
        run: python scripts/lint_missing_values.py

      # The assets are REBUILT and compared, not trusted. A theme asset nobody
      # rebuilt is a figure nobody checked.
      - name: Rebuild the assets and refuse a drifted checkout
        run: |
          python scripts/build_storefront_assets.py
          git diff --exit-code -- assets/inh-cost-tables.json assets/inh-zip-state.json

      # ── THE WRITE ─────────────────────────────────────────────────────────
      # Inputs travel through env, never interpolated into the shell command.
      # The script upserts in two passes (sections and assets, then templates,
      # because Shopify refuses a template whose section is not there yet),
      # halts if the first pass errors, and READS EVERY FILE BACK before it
      # claims anything.
      # ── THE LAST GATE BEFORE THE WRITE, IN THE SAME JOB AS THE WRITE ─────
      # A diff dispatched minutes earlier, in another run, is a measurement of a
      # moment -- the exact thing this is meant to rule out. Seconds before the
      # upsert is the latest point at which "the target has not moved" still
      # means anything. ANY difference stops the job: this compares the target
      # against a frozen copy of ITSELF, so there is no benign difference.
      - name: Refuse the write if the target moved since its snapshot
        if: inputs.live == 'write' && inputs.require_unchanged_vs != ''
        shell: bash
        run: |
          set -o pipefail
          python scripts/diff_themes.py --a "$SNAPSHOT" --b "$THEME_ID" \
            --require-identical | tee -a "$GITHUB_STEP_SUMMARY"

      # THE LIVE OVERRIDE IS PASSED ONLY WHEN IT WAS TYPED, and it must name the
      # same id as the target. An empty input is not an override: it is absent,
      # and the flag is left off entirely rather than sent as "". Same rule as
      # everywhere else here -- an empty string is not a value.
      - name: Upsert
        run: |
          ARGS="--theme-id $THEME_ID"
          if [ "$MODE" = "write" ]; then ARGS="$ARGS --live"; fi
          if [ -n "$ALLOW_LIVE" ]; then
            echo "live-theme override requested for $ALLOW_LIVE"
            ARGS="$ARGS --allow-live-theme-id $ALLOW_LIVE"
          fi
          python scripts/deploy_theme_files.py $ARGS

      # The pages are what a preview URL actually renders. `?preview_theme_id=`
      # on a handle that does not exist is a 404 with a parameter on it -- it
      # reads as a broken theme when nothing was ever created to preview.
      # Bodies are sent as bytes from content/pages/ and read back by length.
      - name: Create or update the page
        if: inputs.live == 'write'
        run: python scripts/deploy_pages.py --pages "$PAGES"

      # Round 3 folded four URLs into one. The three retired handles are
      # UNPUBLISHED first and redirected second -- a published page beats a
      # redirect -- and each 301 is then proved with a real request, because a
      # mutation that returned an id and a URL that redirects are different
      # facts. Idempotent: a correct redirect is left alone.
      - name: Retire the three duplicate URLs into /pages/sauna-cost
        if: inputs.live == 'write' && inputs.pages != 'skip'
        run: |
          python scripts/deploy_redirects.py --live \
            --origin "https://${SHOPIFY_SHOP}"

      # The 301s are checked on EVERY write, whatever `pages` was set to, and
      # with no Admin API call: a request to the old path is the evidence, and
      # it needs no scope -- which matters, because this token has none for
      # navigation. Redirects created by hand are proved here just the same.
      # Proved from BOTH origins. The shop domain exercises the chain a
      # myshopify request walks (canonicalisation hop, then the 301); the
      # primary domain is the one a reader and a search engine actually use,
      # and it is where a redirect that only works via the shop domain would
      # look fine and be useless.
      - name: Prove the three 301s from outside
        if: inputs.live == 'write'
        run: |
          python scripts/deploy_redirects.py --verify-only \
            --origin "https://${SHOPIFY_SHOP}"
          python scripts/deploy_redirects.py --verify-only \
            --origin "https://inhousewellness.com"

  # ── VERIFY THE DEPLOYED PAGE, not a local copy of it ────────────────────
  verify:
    needs: deploy
    if: inputs.live == 'write'
    runs-on: ubuntu-latest
    env:
      THEME_ID: ${{ inputs.theme_id }}
      VERIFY_URL: ${{ inputs.verify_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      # The preview URL is built here and printed, so the log carries the exact
      # link a human can click -- not a description of one.
      # A GIVEN url is used verbatim, here and in the script. `verify_url` set
      # to the public address means the states are proved on the page a reader
      # loads -- no preview parameter, no preview cookie, the live theme doing
      # the rendering. The label carries which one it was, so a screenshot can
      # never be mistaken for the other target.
      - name: Drive every state group against the deployed page
        run: |
          if [ -n "$VERIFY_URL" ]; then
            URL="$VERIFY_URL"; LABEL="live-public"
          else
            URL="https://${SHOPIFY_SHOP}/pages/sauna-cost?preview_theme_id=${THEME_ID}"
            LABEL="deployed-theme-${THEME_ID}"
          fi
          echo "driving: $URL"
          python scripts/verify_calculator_states.py \
            --url "$URL" --label "$LABEL" \
            --shots out/deployed

      # Design review evidence, at the two widths that matter. Separate from the
      # state checks on purpose: a screenshot is not a proof, and a design pass
      # must never be able to report that the seven states passed.
      - name: Photograph the deployed page at desktop and phone width
        run: |
          if [ -n "$VERIFY_URL" ]; then
            URL="$VERIFY_URL"
          else
            URL="https://${SHOPIFY_SHOP}/pages/sauna-cost?preview_theme_id=${THEME_ID}"
          fi
          python scripts/screenshot_calculator.py --url "$URL" \
            --width 1280 --label deployed-desktop --out out/deployed
          python scripts/screenshot_calculator.py --url "$URL" \
            --width 390 --label deployed-mobile --out out/deployed

      - name: Keep the screenshots whatever the outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-states-${{ github.run_number }}
          path: out/deployed
          if-no-files-found: warn
          retention-days: 14
