<!doctype html><html><head><meta charset="utf-8">
<title>InHouse Wellness — Band card system</title>

<!-- Design-system tokens, adopted 2026-09-02 (Round 7). Superset of the old
     hand-rolled tokens.css: same dark ground, plus --flag for warnings and
     contraindications only. -->
<link rel="stylesheet" href="ds/colors.css">
<link rel="stylesheet" href="ds/typography.css">
<link rel="stylesheet" href="ds/spacing.css">

<style>
@font-face{font-family:'Fraunces';src:url('fonts/fraunces-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:block}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/ibm-plex-sans-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:block}

*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;display:flex;flex-wrap:wrap;gap:40px;padding:40px;align-items:flex-start}

/* ---- Direction: "Plate" (ported 2026-09-02 from the design plate) --------
   The timber fills the WHOLE card; a raised plate floats over it carrying the
   headline, the table and the footer, with the kicker in its own capsule above.
   Cooler, darker ground (#131416) than the earlier warm charred base.

   This is also what kills the photo dependency: the timber is generated
   locally, and real photography drops into the same .well at inset:0 with no
   layout change. ---------------------------------------------------------- */
.card{position:relative;overflow:hidden;background:#131416;color:var(--text-body);
  font-family:var(--font-body);font-variant-numeric:tabular-nums}
.card--pin  {width:1000px;height:1500px;font-size:10.00px;--plate-top:26%}
.card--ig   {width:1080px;height:1350px;font-size: 9.72px;--plate-top:24%}
.card--story{width:1080px;height:1920px;font-size:11.88px;--plate-top:30%}

/* Procedural band. Timber tone with grain, one warm light band positioned to
   sit under the plate's top edge, and two hairline seams. Deterministic
   variation is injected per card from the row id -- consecutive cards differ. */
/* Timber base moved #3A2D1E -> #4A3826 (Round 10). At 236px the old pairing
   measured 1.34:1 against the plate and the card read as a single dark mass.
   Warmer and lighter here, deeper and cooler on the plate: 1.69:1 measured. */
.well{position:absolute;inset:0;overflow:hidden;background:#4A3826}
.well .grain{position:absolute;inset:0}
.well .lightband{position:absolute;left:0;right:0;background:rgba(224,160,60,.16)}
.well .seam{position:absolute;left:0;right:0;height:1px}
.well img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* Kicker capsule, sitting on the timber above the plate. Sentence case:
   ALL-CAPS eyebrow labels are banned by the design system. */
.kicker{position:absolute;left:6em;top:6em;z-index:3;background:var(--surface-page);
  padding:1.4em 1.9em;font-size:2.2em;font-weight:600;letter-spacing:.02em;
  line-height:1;color:var(--encode-heat)}
.kicker.warn{color:var(--warn-fg)}

/* Plate deeper and cooler than the token ground, so it sits ON the timber
   rather than blending into it. The top edge is a deliberate hairline one step
   lighter than the plate, not a gradient. */
.plate{position:absolute;inset:var(--plate-top) 6em 6em;z-index:2;
  background:#161009;border:1px solid rgba(233,229,221,.14);
  border-top:1px solid #2A2018;
  box-shadow:0 -0.1em 0 0 rgba(0,0,0,.45), 0 2em 5em rgba(0,0,0,.5);
  display:flex;flex-direction:column;overflow:hidden}

/* The carried brand device: a ticked measurement rule down the plate's edge.
   The design notes call it out as the thing no lifestyle pin has. */
.spine{position:absolute;left:0;top:0;bottom:0;width:2.8em;z-index:3;
  border-right:1px solid var(--border-rule);
  background-image:
    repeating-linear-gradient(to bottom,var(--border-rule) 0 1px,rgba(0,0,0,0) 1px 5em),
    repeating-linear-gradient(to bottom,var(--border-strong) 0 1px,rgba(0,0,0,0) 1px 25em);
  background-size:1em 100%,2.8em 100%;background-repeat:repeat-y,repeat-y}

.headwrap{flex:0 0 auto;padding:4.2em 5em 0 7.6em}
.head{font-family:var(--font-display);font-weight:700;line-height:1.03;
  letter-spacing:-.02em;text-wrap:pretty}

.body{flex:1 1 auto;min-height:0;overflow:hidden;font-size:90%;
  padding:1.6em 5em 0 7.6em;display:flex;flex-direction:column;justify-content:flex-start}

.foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:2em;
  margin:0 5em 0 7.6em;border-top:1px solid var(--border-rule);padding:2.2em 0 2.8em}
.foot .brand{display:flex;align-items:center;gap:1.1em;color:var(--text-body)}
.foot .mark{width:3.0em;height:2.25em;flex:none;display:block;overflow:visible}
.foot b{font-family:var(--font-display);font-weight:700;font-size:2.2em;line-height:1}
.foot .url{font-size:2em;color:var(--text-muted)}

/* ---- Track B chart band ------------------------------------------------
   The finding is visual, so show it. Every chart must carry its point as a
   SHAPE at 236px: no legends needing colour discrimination, no multi-series
   lines, no axis text under 17px. --heat/--cold encode, --flag is the
   undisclosed portion. --------------------------------------------------- */
.chart{display:flex;flex-direction:column;gap:1.4em}
.ch-figure{font-family:var(--font-display);font-weight:700;font-size:13em;
  line-height:.86;letter-spacing:-.03em;color:var(--encode-heat)}
.ch-sub{font-size:2.4em;line-height:1.35;color:var(--text-muted);max-width:26ch}

/* dot plot: filled vs undisclosed. The block of --flag IS the finding. */
.dots{display:flex;flex-wrap:wrap;gap:.55em;margin:.4em 0 .2em}
.dots i{width:1.9em;height:1.9em;border-radius:50%;background:var(--encode-heat)}
.dots i.off{background:var(--warn-fg);opacity:.85}
.ch-key{display:flex;gap:2.6em;font-size:2em;color:var(--text-muted);margin-top:.5em}
.ch-key span{display:flex;align-items:center;gap:.7em}
.ch-key b{width:1.5em;height:1.5em;border-radius:50%;display:inline-block}

/* range bar: min -> median -> max as one shape */
.range{margin:.6em 0 .2em}
.range .track{position:relative;height:2.6em;background:var(--encode-heat-field);
  border-left:3px solid var(--encode-heat);border-right:3px solid var(--encode-cold)}
.range .med{position:absolute;top:-.5em;bottom:-.5em;width:3px;background:var(--paper)}
.range .ends{display:flex;justify-content:space-between;margin-top:.9em;font-size:2.2em}
.range .ends .lo{color:var(--encode-heat);font-weight:600}
.range .ends .hi{color:var(--encode-cold);font-weight:600}
.range .cap{display:flex;justify-content:space-between;font-size:1.9em;color:var(--text-muted);margin-top:.35em}

/* bar: up to 6 categories, value inline so no axis is needed */
.bars{display:flex;flex-direction:column;gap:1.05em;margin:.4em 0}
.bar{display:grid;grid-template-columns:1fr;gap:.4em}
.bar .lab{font-size:2.05em;color:var(--text-muted);line-height:1.2}
.bar .track{height:2.3em;background:rgba(233,229,221,.07);position:relative}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--encode-heat)}
.bar .track{background:rgba(233,229,221,.10)}
.bar .fill.alt{background:var(--encode-cold)}
.bar .val{position:absolute;right:.6em;top:50%;transform:translateY(-50%);
  font-size:1.9em;font-weight:600;color:var(--text-body)}

/* ---- archetype bodies --------------------------------------------------- */
.cmp-h{display:grid;grid-template-columns:1fr 1fr;gap:0 1em;padding-bottom:1.5em}
.cmp-h div{font-size:2.8em;font-weight:700;line-height:1.1;padding:0 .25em}
.cmp-h .a{color:var(--encode-heat)} .cmp-h .b{color:var(--encode-cold)}
.cmp-r{border-top:1px solid var(--border-rule);padding:1.6em 0 1.8em}
.cmp-r .lab{font-size:1.95em;line-height:1.2;color:var(--text-muted);margin-bottom:.55em}
.cmp-v{display:grid;grid-template-columns:1fr 1fr;gap:0 1em}
.cmp-v div{font-size:3.0em;font-weight:600;line-height:1.18;overflow-wrap:anywhere;padding:.3em .35em}
/* Accent presence raised from .10 to .22/.20 alpha plus a 3px leading edge.
   At browse width the tinted column reads as a shape; the text does not. */
.cmp-v .a{background:rgba(224,160,60,.22);box-shadow:inset .35em 0 0 var(--encode-heat)}
.cmp-v .b{background:rgba(111,168,184,.20);box-shadow:inset .35em 0 0 var(--encode-cold)}

.fig{font-family:var(--font-display);font-weight:700;font-size:20em;line-height:.84;
  letter-spacing:-.035em;color:var(--encode-heat)}
.unit{font-size:2.7em;line-height:1.35;color:var(--text-muted);margin:.85em 0 1.4em;max-width:24ch}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:2.4em;
  border-top:1px solid var(--border-rule);padding:1.7em 0;font-size:2.6em;line-height:1.2}
.kv .k{color:var(--text-muted);flex:1 1 auto;min-width:0}
.kv .v{font-weight:600;text-align:right;overflow-wrap:anywhere;color:var(--encode-heat)}

.spec{display:flex;justify-content:space-between;align-items:baseline;gap:2.6em;
  border-top:1px solid var(--border-rule);padding:2.3em 0}
.spec .k{font-size:2.5em;line-height:1.25}
.spec .v{font-size:4.2em;font-weight:700;line-height:1.05;color:var(--encode-heat);text-align:right;overflow-wrap:anywhere}
.spec{background:linear-gradient(to right,rgba(0,0,0,0) 60%,rgba(224,160,60,.10) 100%)}

.item{display:flex;align-items:baseline;gap:2.2em;border-top:1px solid var(--border-rule);padding:2.4em 0}
.item i{flex:none;width:2.6em;height:.3em;background:var(--encode-heat);transform:translateY(-.4em)}
.item p{font-size:3.1em;line-height:1.3;text-wrap:pretty}

.finding{font-size:2.8em;line-height:1.5;margin-bottom:1.2em;text-wrap:pretty}
.badge{align-self:flex-start;border:1px solid var(--encode-cold);color:var(--encode-cold);
  padding:1em 1.5em;font-size:2.1em;font-weight:600;letter-spacing:.06em;line-height:1}
.src{margin-top:1.7em;border-top:1px solid var(--border-rule);padding-top:1.5em;
  font-size:2em;line-height:1.5;color:var(--text-muted);text-wrap:pretty}

.corr{border-top:1px solid var(--border-rule);padding:2.2em 0 2.6em}
.corr.y{padding-bottom:0}
.corr .lab{font-size:2.1em;font-weight:600;letter-spacing:.02em;margin-bottom:1em}
.corr.x .lab{color:var(--text-muted)} .corr.y .lab{color:var(--encode-heat)}
.corr .row{font-size:2.9em;line-height:1.34;padding:.3em 0;text-wrap:pretty}
.corr.x .row{color:var(--text-muted);text-decoration:line-through}

.note{flex:none;margin-top:auto;padding-top:1.5em;font-size:2em;line-height:1.5;color:var(--text-muted);max-width:44ch}
.note.warn{color:var(--warn-fg)}
</style></head><body><div id="stage"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SIZE = {pinterest:'pin', pin:'pin', ig:'ig', story:'story'};

/* Sentence case: the design system bans ALL-CAPS eyebrow labels. */
function sentence(s){
  s = String(s ?? '').replace(/_/g,' ').trim();
  if(!s) return '';
  if(s === s.toUpperCase()) s = s.toLowerCase();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

const BODY = {
  comparison: d => `
    <div class="cmp-h"><div class="a">${esc(d.a)}</div><div class="b">${esc(d.b)}</div></div>
    ${(d.rows||[]).map(r => `<div class="cmp-r"><div class="lab">${esc(r[0])}</div>
      <div class="cmp-v"><div class="a">${esc(r[1])}</div><div class="b">${esc(r[2])}</div></div></div>`).join('')}`,

  cost: d => `
    <div class="fig">${esc(d.figure)}</div>
    <div class="unit">${esc(d.unit)}</div>
    ${(d.rows||[]).map(r => `<div class="kv"><div class="k">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`).join('')}`,

  spec: d => (d.rows||[]).map(r =>
    `<div class="spec"><div class="k">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`).join(''),

  checklist: d => (d.items||[]).map(t =>
    `<div class="item"><i></i><p>${esc(t)}</p></div>`).join(''),

  evidence: d => `
    <div class="finding">${esc(d.finding)}</div>
    <div class="badge">${esc(d.strength || 'evidence')}</div>
    <div class="src">${esc(d.source)}</div>`,

  chart: d => {
    const c = d.chart || {};
    if(c.type === 'dot'){
      const total = Math.min(c.total|0, 120), on = Math.round((c.filled/c.total)*total);
      let dots = '';
      for(let i=0;i<total;i++) dots += `<i class="${i<on?'':'off'}"></i>`;
      return `<div class="chart">
        <div class="ch-figure">${esc(c.filled)}<span style="font-size:.42em;color:var(--text-muted)"> of ${esc(c.total)}</span></div>
        <div class="dots">${dots}</div>
        <div class="ch-key">
          <span><b style="background:var(--encode-heat)"></b>${esc(c.label_filled||'Yes')}</span>
          <span><b style="background:var(--warn-fg)"></b>${esc(c.label_rest||'No')}</span>
        </div></div>`;
    }
    if(c.type === 'range'){
      const span = (c.max - c.min) || 1, pos = ((c.median - c.min)/span*100).toFixed(1);
      const u = c.unit === '$' ? '' : (c.unit || '');
      const pre = c.unit === '$' ? '$' : '';
      return `<div class="chart">
        <div class="ch-figure">${esc(pre)}${esc(c.max)}${esc(u)}</div>
        <div class="ch-sub">highest of ${esc(c.max_label||'')}, against ${esc(pre)}${esc(c.min)}${esc(u)} lowest</div>
        <div class="range"><div class="track"><div class="med" style="left:${pos}%"></div></div>
          <div class="ends"><span class="lo">${esc(pre)}${esc(c.min)}${esc(u)}</span><span class="hi">${esc(pre)}${esc(c.max)}${esc(u)}</span></div>
          <div class="cap"><span>${esc(c.min_label||'')}</span><span>median ${esc(pre)}${esc(c.median)}${esc(u)}</span><span>${esc(c.max_label||'')}</span></div>
        </div></div>`;
    }
    const items = (c.items||[]).slice(0,6);
    const max = Math.max(...items.map(i=>i[1]), 1);
    return `<div class="chart"><div class="bars">${items.map((it,ix)=>`
      <div class="bar"><div class="lab">${esc(it[0])}</div>
        <div class="track"><div class="fill${ix?' alt':''}" style="width:${(it[1]/max*100).toFixed(1)}%"></div>
        <div class="val">${esc(it[1])}</div></div></div>`).join('')}</div></div>`;
  },

  correction: d => `
    <div class="corr x"><div class="lab">${esc(d.xLabel)}</div>
      ${(d.x||[]).map(t => `<div class="row">${esc(t)}</div>`).join('')}</div>
    <div class="corr y"><div class="lab">${esc(d.yLabel)}</div>
      ${(d.y||[]).map(t => `<div class="row">${esc(t)}</div>`).join('')}</div>`,
};

/* Headline scale by archetype and length, ported from the design's renderVals. */
function headSize(arch, head){
  const n = String(head||'').length;
  if(arch === 'evidence') return n>96?3.9:n>62?4.6:5.4;
  if(arch === 'cost' || arch === 'spec') return n>70?3.6:n>46?4.3:5.1;
  return n>90?4:n>58?4.9:n>34?5.9:7;
}

/* Deterministic per-card variation, seeded from the row id. Consecutive cards
   must differ or the procedural band reads as a repeated placeholder. */
function seedOf(str){
  let h = 2166136261;
  for(let i=0;i<String(str).length;i++){ h ^= String(str).charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let t = h;
    t = Math.imul(t ^ (t>>>15), t | 1); t ^= t + Math.imul(t ^ (t>>>7), t | 61);
    return ((t ^ (t>>>14))>>>0) / 4294967296; };
}

/* Timber. The first version read as a flat vertical gradient -- muddy, no
   depth, and it looked like a placeholder despite being deliberate. Reworked:
   discrete slats with their own tonal variance, irregular grain within each
   slat, a soft warm falloff rather than a hard band, and a vignette so the
   plate does not float on flat colour. Seeded per row id, as before. */
function timber(id){
  const r = seedOf(id || 'x');
  const pick = (a, b) => a + r() * (b - a);

  // --- discrete slats, each with its own tone ------------------------------
  const n = Math.round(pick(9, 14));          // slats across the card
  const w = 100 / n;
  let slats = '', grain = '';
  for(let i = 0; i < n; i++){
    // Tonal variance BETWEEN slats -- real timber is not one colour.
    const l = pick(-0.10, 0.12);              // lightness offset
    const hueShift = pick(-4, 5);
    const col = `hsl(${28 + hueShift} ${Math.round(pick(28, 40))}% ${Math.round((23 + l * 52))}%)`;
    slats += `<div style="position:absolute;top:0;bottom:0;left:${(i*w).toFixed(3)}%;`
          +  `width:${w.toFixed(3)}%;background:${col}"></div>`;
    // Seam shadow on the left edge of each slat, varying in weight.
    slats += `<div style="position:absolute;top:0;bottom:0;left:${(i*w).toFixed(3)}%;`
          +  `width:${pick(0.10,0.30).toFixed(2)}%;background:rgba(0,0,0,${pick(0.22,0.42).toFixed(2)})"></div>`;
    // --- grain irregularity WITHIN the slat: a few off-centre hairlines ----
    const lines = Math.round(pick(2, 5));
    for(let k = 0; k < lines; k++){
      const x = (i * w) + pick(0.12, 0.88) * w;
      grain += `<div style="position:absolute;top:${pick(-6,0).toFixed(1)}%;`
            +  `height:${pick(104,124).toFixed(0)}%;left:${x.toFixed(3)}%;`
            +  `width:${pick(0.05,0.16).toFixed(3)}%;`
            +  `background:rgba(233,229,221,${pick(0.03,0.085).toFixed(3)});`
            +  `transform:rotate(${pick(-0.5,0.5).toFixed(2)}deg);`
            +  `transform-origin:top center"></div>`;
    }
  }

  // --- warm light band, soft falloff both ways -----------------------------
  const top  = pick(20, 30);
  const h    = pick(20, 30);
  const warm = pick(0.20, 0.30);          // lit wood, not shadow
  const band = `<div style="position:absolute;left:0;right:0;top:${(top-8).toFixed(1)}%;`
             + `height:${(h+16).toFixed(1)}%;background:linear-gradient(to bottom,`
             + `rgba(224,160,60,0) 0%, rgba(224,160,60,${(warm*0.45).toFixed(3)}) 22%,`
             + `rgba(224,160,60,${warm.toFixed(3)}) 50%,`
             + `rgba(224,160,60,${(warm*0.4).toFixed(3)}) 78%,`
             + `rgba(224,160,60,0) 100%)"></div>`;

  // --- depth: a vignette so the plate sits ON something --------------------
  const vig = `<div style="position:absolute;inset:0;background:`
            + `radial-gradient(120% 85% at ${pick(35,65).toFixed(0)}% ${pick(20,40).toFixed(0)}%,`
            + `rgba(255,255,255,.05) 0%, rgba(0,0,0,0) 45%, rgba(0,0,0,.42) 100%)"></div>`;

  return slats + grain + band + vig;
}

function card(d){
  const size = SIZE[d.size || 'pinterest'] || 'pin';
  const arch = d.type;
  const fn = BODY[arch];
  const body = fn ? fn(d) : '';
  /* Real photography drops in here at inset:0 -- same layout, no change. */
  const well = d.image
    ? `<img src="${esc(d.image)}" alt="">`
    : timber(d.id);
  const warn = d.flag ? ' warn' : '';
  return `<div class="card card--${size} on-dark" id="card-${esc(d.id)}">
    <div class="well">${well}</div>
    ${d.kicker ? `<div class="kicker${warn}">${esc(sentence(d.kicker))}</div>` : ''}
    <div class="plate">
      <div class="spine"></div>
      <div class="headwrap"><div class="head" style="font-size:${headSize(arch, d.headline)}em">${esc(d.headline)}</div></div>
      <div class="body">${body}${d.note ? `<div class="note${warn}">${esc(d.note)}</div>` : ''}</div>
      <div class="foot">
      <span class="brand">
        <!-- The InHouse Wellness mark, derived from logo-1200-628.png.
             The supplied file is an integrated lockup: the house ENCLOSES the
             wordmark, so the two do not separate by cropping, and the whole
             lockup is unreadable at 24px. The house geometry is redrawn here as
             a stroked path -- open on the right, baseline extending under the
             name, rounded joins -- which stays crisp at any size, and the name
             stays as live Fraunces beside it. -->
        <svg class="mark" viewBox="0 0 128 96" fill="none" aria-hidden="true">
          <path d="M10 50 L64 10 L118 50" stroke="currentColor" stroke-width="9"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 44 L22 86 L124 86" stroke="currentColor" stroke-width="9"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <b>InHouse Wellness</b>
      </span>
      <span class="url">inhousewellness.com</span>
    </div>
    </div>
  </div>`;
}

/* Fit the body WITHOUT breaking the 17px floor.
   The design system sets a 17px body floor because the audience is 40-60, and
   smaller type is not shippable. The first Band render shrank comparison cells
   to roughly 8px chasing a fit, which is worse than showing fewer rows.
   Order of concessions: shrink the headline, then shrink body type to the
   floor, then DROP TRAILING ROWS. Never go under the floor. */
const BODY_FLOOR_PX = 17;

function fits(body){ return body.scrollHeight <= body.clientHeight + 2; }

function autofit(root){
  root.querySelectorAll('.card').forEach(c => {
    const head = c.querySelector('.head'), body = c.querySelector('.body');
    if(!head || !body) return;

    // 1. headline first -- it has the most slack
    let hs = parseFloat(getComputedStyle(head).fontSize), guard = 0;
    while(!fits(body) && hs > 34 && guard++ < 60){
      hs -= 2; head.style.fontSize = hs + 'px';
    }

    // 2. body type down to, never through, the floor
    const shrinkable = [...body.querySelectorAll(
      '.cmp-v div,.cmp-r .lab,.item p,.corr .row,.kv,.spec .k,.spec .v,.finding,.unit,.note,.cmp-h div')];
    guard = 0;
    while(!fits(body) && guard++ < 40){
      let moved = false;
      shrinkable.forEach(el => {
        const px = parseFloat(getComputedStyle(el).fontSize);
        if(px > BODY_FLOOR_PX){ el.style.fontSize = Math.max(BODY_FLOOR_PX, px - 1) + 'px'; moved = true; }
      });
      if(!moved) break;
    }

    // 3. still overflowing at the floor -> remove trailing rows, and say so.
    //    The validator holds the lower bound at MIN_BODY_ROWS, so a card that
    //    cannot show enough rows fails rather than rendering a stub.
    const rows = [...body.querySelectorAll('.cmp-r,.kv,.spec,.item')];
    let dropped = 0;
    while(!fits(body) && rows.length - dropped > 3){
      rows[rows.length - 1 - dropped].style.display = 'none';
      dropped++;
    }
    c.dataset.rowsDropped = dropped;
    c.dataset.minBodyPx = Math.min(...shrinkable.map(
      el => parseFloat(getComputedStyle(el).fontSize)).concat([99]));
  });
}

window.render = function(payload){
  document.getElementById('stage').innerHTML = payload.map(card).join('');
  autofit(document);
};
</script></body></html>
